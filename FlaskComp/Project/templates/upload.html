<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir archivo y procesar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px 20px; /* Aumentar el padding para una mejor apariencia */
            color: #333;
        }

        h1 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px; /* Añadir margen inferior para separar del formulario */
        }

        .container {
            max-width: 800px; /* Ampliar el ancho del contenedor */
            margin: auto;
            background-color: #fff;
            padding: 30px; /* Aumentar el padding del contenedor */
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); /* Mejora la sombra */
            border-radius: 10px;
        }

        button {
            background-color: #0056b3;
            color: white;
            padding: 10px 15px; /* Ajustar el padding del botón */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: 20px auto; /* Margen superior e inferior para separación */
            font-size: 16px; /* Aumentar el tamaño de fuente del botón */
            transition: background-color 0.3s; /* Suavizar la transición del color de fondo */
        }

        button:hover {
            background-color: #003d80;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Subir archivo y procesar</h1>
        <form action="/uploader" method="POST" enctype="multipart/form-data">
            <div class="input-group mb-3">
                <input type="file" class="form-control" id="file-name" name="file" required>
            </div>
            <div class="mb-3">
                <input type="number" class="form-control" name="semana" placeholder="Ingrese la semana" required min="1">
            </div>
            <button type="submit">Subir y procesar</button>
        </form>
    </div>
    <script>
        // Función para actualizar el texto del campo de archivo (opcional)
        document.getElementById('file-name').addEventListener('change', function() {
            const fileName = this.files[0] ? this.files[0].name : 'Elegir archivo';
            this.nextElementSibling.innerText = fileName;
        });
    </script>
</body>
</html>
